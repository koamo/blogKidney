<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg6)"/>
  
  <text x="400" y="55" fill="#f0fdf4" font-size="24" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">신장이식 후 이식콩팥 장기 생존을 위한 4대 핵심 관리 지침</text>
  <text x="400" y="85" fill="#bbf7d0" font-size="14" text-anchor="middle" font-family="system-ui, sans-serif">면역억제제 정시 복용 · 감염 예방 · 거부반응 징후 모니터링</text>

  <!-- Box 1 -->
  <g transform="translate(50, 120)">
    <rect width="330" height="110" rx="12" fill="#166534" stroke="#4ade80" stroke-width="1.5"/>
    <text x="25" y="35" fill="#ffffff" font-size="16" font-weight="bold">1. 면역억제제 정시 정확 복용</text>
    <text x="25" y="60" fill="#dcfce7" font-size="12.5">• 12시간 간격 정확한 시간 복용 (오차 30분 이내)</text>
    <text x="25" y="82" fill="#dcfce7" font-size="12.5">• 자몽(Grapefruit) 등 약물 농도 변동 식품 금지</text>
  </g>

  <!-- Box 2 -->
  <g transform="translate(420, 120)">
    <rect width="330" height="110" rx="12" fill="#166534" stroke="#4ade80" stroke-width="1.5"/>
    <text x="25" y="35" fill="#ffffff" font-size="16" font-weight="bold">2. 급성 거부반응 징후 포착</text>
    <text x="25" y="60" fill="#dcfce7" font-size="12.5">• 37.5℃ 이상 발열, 이식 부위 압통/부종 발생 시</text>
    <text x="25" y="82" fill="#dcfce7" font-size="12.5">• 갑작스러운 체중 증가 및 소변량 급감 즉시 내원</text>
  </g>

  <!-- Box 3 -->
  <g transform="translate(50, 250)">
    <rect width="330" height="110" rx="12" fill="#166534" stroke="#4ade80" stroke-width="1.5"/>
    <text x="25" y="35" fill="#ffffff" font-size="16" font-weight="bold">3. 기회감염 예방 위생 철칙</text>
    <text x="25" y="60" fill="#dcfce7" font-size="12.5">• 외출 시 KF94 마스크 착용 및 손 씻기 생활화</text>
    <text x="25" y="82" fill="#dcfce7" font-size="12.5">• 익히지 않은 굴·회·생고기 섭취 금지 (식중독 방지)</text>
  </g>

  <!-- Box 4 -->
  <g transform="translate(420, 250)">
    <rect width="330" height="110" rx="12" fill="#166534" stroke="#4ade80" stroke-width="1.5"/>
    <text x="25" y="35" fill="#ffffff" font-size="16" font-weight="bold">4. 정기 혈중 약물 농도 검사</text>
    <text x="25" y="60" fill="#dcfce7" font-size="12.5">• 채혈 검사 당일 아침 면역억제제 복용 금지 (채혈 후 복용)</text>
    <text x="25" y="82" fill="#dcfce7" font-size="12.5">• 혈청 크레아티닌 및 혈압 수치 수첩 기록</text>
  </g>

  <text x="400" y="415" fill="#bbf7d0" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif">※ 면역억제제는 임의로 임의 감량하거나 복용을 중단해서는 절대 안 됩니다.</text>
</svg>
