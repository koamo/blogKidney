<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg4)"/>
  
  <text x="400" y="55" fill="#fef3c7" font-size="24" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">신장 기능 저하 시 주의해야 할 영양제 및 성분 점검표</text>
  <text x="400" y="85" fill="#fde68a" font-size="14" text-anchor="middle" font-family="system-ui, sans-serif">KidneyLife 약물·건강기능식품 복용 안전 가이드</text>

  <!-- Left: 주의/금기 성분 -->
  <g transform="translate(60, 120)">
    <rect width="320" height="250" rx="14" fill="#92400e" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="160" y="35" fill="#ef4444" font-size="18" font-weight="bold" text-anchor="middle">⚠️ 섭취 시 각별한 주의가 필요한 성분</text>
    <line x1="20" y1="50" x2="300" y2="50" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
    
    <text x="35" y="85" fill="#fef3c7" font-size="13" font-weight="bold">• 고용량 비타민 C (일 500mg 이상)</text>
    <text x="45" y="105" fill="#fde68a" font-size="12">→ 체내 수산(Oxalate) 축적 및 신장결석 위험</text>

    <text x="35" y="135" fill="#fef3c7" font-size="13" font-weight="bold">• 칼륨 보충제 및 칼륨 함유 종합비타민</text>
    <text x="45" y="155" fill="#fde68a" font-size="12">→ 치명적 부정맥 위험 (고칼륨혈증 발생)</text>

    <text x="35" y="185" fill="#fef3c7" font-size="13" font-weight="bold">• 고용량 농축 한약재 및 약초 추출물</text>
    <text x="45" y="205" fill="#fde68a" font-size="12">→ 미지의 생약 성분에 의한 급성 신손상 주의</text>
  </g>

  <!-- Right: 안전 수칙 -->
  <g transform="translate(420, 120)">
    <rect width="320" height="250" rx="14" fill="#92400e" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="160" y="35" fill="#10b981" font-size="18" font-weight="bold" text-anchor="middle">✅ 안전한 올바른 복용 수칙</text>
    <line x1="20" y1="50" x2="300" y2="50" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>

    <text x="35" y="85" fill="#fef3c7" font-size="13" font-weight="bold">1. 복용 중인 전체 성분 목록 지참</text>
    <text x="45" y="105" fill="#fde68a" font-size="12">처방약·영양제·즙 형태 제품 포함하여 진료 시 지참</text>

    <text x="35" y="135" fill="#fef3c7" font-size="13" font-weight="bold">2. 수용성 비타민 B/C 수용 수치 확인</text>
    <text x="45" y="155" fill="#fde68a" font-size="12">투석 환자는 투석용 비타민(Renal Vitamin) 전용 복용</text>

    <text x="35" y="185" fill="#fef3c7" font-size="13" font-weight="bold">3. 과대광고 제품 주의</text>
    <text x="45" y="205" fill="#fde68a" font-size="12">'콩팥 재생', '신장 기능 회복' 과장 제품 금물</text>
  </g>

  <text x="400" y="415" fill="#fde68a" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif">※ 영양제 구입 전 반드시 담당 주치의 및 임상약사와 상의 후 복용하세요.</text>
</svg>
