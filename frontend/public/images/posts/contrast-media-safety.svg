<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg3)"/>
  
  <text x="400" y="55" fill="#e0e7ff" font-size="24" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">CT·조영제 검사 전후 신장 기능(eGFR) 보호 안전 지침</text>
  <text x="400" y="85" fill="#a5b4fc" font-size="14" text-anchor="middle" font-family="system-ui, sans-serif">조영제 유발 급성 신손상(CIN) 예방을 위한 단계별 체크리스트</text>

  <!-- Step 1: 검사 전 -->
  <g transform="translate(50, 130)">
    <rect width="210" height="230" rx="14" fill="#3730a3" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="20" y="20" width="170" height="35" rx="8" fill="#4f46e5"/>
    <text x="105" y="43" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">1. 검사 전 (Pre-CT)</text>
    <text x="25" y="85" fill="#c7d2fe" font-size="13">• 최근 eGFR 수치 확인</text>
    <text x="25" y="110" fill="#c7d2fe" font-size="13">• 당뇨약(Metformin) 중단 상의</text>
    <text x="25" y="135" fill="#c7d2fe" font-size="13">• 이뇨제·NSAIDs 조절</text>
    <text x="25" y="160" fill="#c7d2fe" font-size="13">• 사전 수분 섭취 안내 준수</text>
    <text x="25" y="185" fill="#e0e7ff" font-size="12" font-weight="bold">★ 신장내과 사전 협진 필수</text>
  </g>

  <!-- Step 2: 검사 당일 -->
  <g transform="translate(295, 130)">
    <rect width="210" height="230" rx="14" fill="#3730a3" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="20" y="20" width="170" height="35" rx="8" fill="#4f46e5"/>
    <text x="105" y="43" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">2. 검사 당일 (Procedure)</text>
    <text x="25" y="85" fill="#c7d2fe" font-size="13">• 필요 시 생리식염수 수액 정맥 주사</text>
    <text x="25" y="110" fill="#c7d2fe" font-size="13">• 등삼투성/저삼투성 조영제 선택</text>
    <text x="25" y="135" fill="#c7d2fe" font-size="13">• 최소량의 조영제 투여</text>
    <text x="25" y="160" fill="#c7d2fe" font-size="13">• 알레르기 반응 즉시 알림</text>
    <text x="25" y="185" fill="#e0e7ff" font-size="12" font-weight="bold">★ 미세 탈수 상태 방지</text>
  </g>

  <!-- Step 3: 검사 후 -->
  <g transform="translate(540, 130)">
    <rect width="210" height="230" rx="14" fill="#3730a3" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="20" y="20" width="170" height="35" rx="8" fill="#4f46e5"/>
    <text x="105" y="43" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">3. 검사 후 (Post-CT)</text>
    <text x="25" y="85" fill="#c7d2fe" font-size="13">• 충분한 미온수 섭취 (조영제 배출)</text>
    <text x="25" y="110" fill="#c7d2fe" font-size="13">• 48시간 후 크레아티닌/eGFR 재검사</text>
    <text x="25" y="135" fill="#c7d2fe" font-size="13">• 소변량 감소·붓기 모니터링</text>
    <text x="25" y="160" fill="#c7d2fe" font-size="13">• 중단했던 약물 재개 시점 확인</text>
    <text x="25" y="185" fill="#e0e7ff" font-size="12" font-weight="bold">★ 배출 촉진 및 추적 관찰</text>
  </g>

  <text x="400" y="415" fill="#a5b4fc" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif">※ eGFR 30 미만 중증 신기능 저하 독자는 조영제 검사 전 담당 신장내과 전문의 상담이 필수입니다.</text>
</svg>
