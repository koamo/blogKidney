<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg5)"/>
  
  <text x="400" y="55" fill="#f8fafc" font-size="24" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">혈액투석 &amp; 복막투석 환자 일상 자가관리 체크리스트</text>
  <text x="400" y="85" fill="#cbd5e1" font-size="14" text-anchor="middle" font-family="system-ui, sans-serif">투석 효율 유지 및 합병증 예방을 위한 매일 체크 항목</text>

  <!-- Left Column: 혈액투석 (HD) -->
  <g transform="translate(60, 120)">
    <rect width="320" height="250" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="20" y="20" width="280" height="35" rx="8" fill="#0284c7"/>
    <text x="160" y="43" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">🩸 혈액투석 (Hemodialysis) 자가관리</text>
    
    <text x="35" y="85" fill="#f1f5f9" font-size="13" font-weight="bold">1. 동정맥류(혈관) 관리</text>
    <text x="45" y="105" fill="#94a3b8" font-size="12">매일 바짝 소리(Thrilling) 감촉 및 청진 확인</text>

    <text x="35" y="135" fill="#f1f5f9" font-size="13" font-weight="bold">2. 건체중(Dry Weight) 및 체중 증가량</text>
    <text x="45" y="155" fill="#94a3b8" font-size="12">투석 간 체중 증가 투석 건체중 5% 이내 유지</text>

    <text x="35" y="185" fill="#f1f5f9" font-size="13" font-weight="bold">3. 투석 팔 주의사항</text>
    <text x="45" y="205" fill="#94a3b8" font-size="12">혈압 측정·채혈·베개 괴기·무거운 짐 금지</text>
  </g>

  <!-- Right Column: 복막투석 (PD) -->
  <g transform="translate(420, 120)">
    <rect width="320" height="250" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="20" y="20" width="280" height="35" rx="8" fill="#0284c7"/>
    <text x="160" y="43" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">💧 복막투석 (Peritoneal Dialysis) 자가관리</text>
    
    <text x="35" y="85" fill="#f1f5f9" font-size="13" font-weight="bold">1. 출구(Exit-site) 소독 및 소독 상태</text>
    <text x="45" y="95" fill="#94a3b8" font-size="12">발적·통증·분비물(고름) 여부 매일 확인</text>

    <text x="35" y="135" fill="#f1f5f9" font-size="13" font-weight="bold">2. 배액(Effluent) 탁도 관찰</text>
    <text x="45" y="155" fill="#94a3b8" font-size="12">복막염 신호인 혼탁한 배액 발생 시 즉시 내원</text>

    <text x="35" y="185" fill="#f1f5f9" font-size="13" font-weight="bold">3. 철저한 무균 교환 철칙</text>
    <text x="45" y="205" fill="#94a3b8" font-size="12">마스크 착용, 손 위생 6단계 지침 준수</text>
  </g>

  <text x="400" y="415" fill="#94a3b8" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif">※ 이상 증상(발열, 복통, 혈관 소리 끊김) 발생 시 투석실로 즉시 연락하세요.</text>
</svg>
