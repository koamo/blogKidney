<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="s1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="s2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="s3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="s4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="s5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <text x="400" y="55" fill="#f8fafc" font-size="24" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">만성콩팥병(CKD) 1~5단계 사구체여과율(eGFR) 지침</text>
  <text x="400" y="85" fill="#94a3b8" font-size="14" text-anchor="middle" font-family="system-ui, sans-serif">KidneyLife 환자 자가관리 가이드 · KDIGO 기준</text>

  <!-- 1단계 -->
  <g transform="translate(40, 130)">
    <rect width="130" height="240" rx="12" fill="url(#s1)" opacity="0.9"/>
    <text x="65" y="35" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">1단계</text>
    <text x="65" y="60" fill="#ecfdf5" font-size="13" text-anchor="middle">eGFR ≥ 90</text>
    <line x1="15" y1="75" x2="115" y2="75" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="65" y="110" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">정상/경미</text>
    <text x="65" y="140" fill="#ecfdf5" font-size="12" text-anchor="middle">원인 질환 조절</text>
    <text x="65" y="165" fill="#ecfdf5" font-size="12" text-anchor="middle">혈압·혈당 관리</text>
    <text x="65" y="190" fill="#ecfdf5" font-size="12" text-anchor="middle">연 1회 검사</text>
  </g>

  <!-- 2단계 -->
  <g transform="translate(185, 130)">
    <rect width="130" height="240" rx="12" fill="url(#s2)" opacity="0.9"/>
    <text x="65" y="35" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">2단계</text>
    <text x="65" y="60" fill="#eff6ff" font-size="13" text-anchor="middle">eGFR 60~89</text>
    <line x1="15" y1="75" x2="115" y2="75" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="65" y="110" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">경도 감소</text>
    <text x="65" y="140" fill="#eff6ff" font-size="12" text-anchor="middle">진행 지연 목표</text>
    <text x="65" y="165" fill="#eff6ff" font-size="12" text-anchor="middle">신독성 약물 주의</text>
    <text x="65" y="190" fill="#eff6ff" font-size="12" text-anchor="middle">6개월 검사</text>
  </g>

  <!-- 3단계 -->
  <g transform="translate(330, 130)">
    <rect width="140" height="240" rx="12" fill="url(#s3)" opacity="0.9"/>
    <text x="70" y="35" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">3단계 (a/b)</text>
    <text x="70" y="60" fill="#fffbeb" font-size="13" text-anchor="middle">eGFR 30~59</text>
    <line x1="15" y1="75" x2="125" y2="75" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="70" y="110" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">중등도 감소</text>
    <text x="70" y="140" fill="#fffbeb" font-size="12" text-anchor="middle">합병증 수치 점검</text>
    <text x="70" y="165" fill="#fffbeb" font-size="12" text-anchor="middle">단백질 제한 상담</text>
    <text x="70" y="190" fill="#fffbeb" font-size="12" text-anchor="middle">3개월 검사</text>
  </g>

  <!-- 4단계 -->
  <g transform="translate(485, 130)">
    <rect width="130" height="240" rx="12" fill="url(#s4)" opacity="0.9"/>
    <text x="65" y="35" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">4단계</text>
    <text x="65" y="60" fill="#fff7ed" font-size="13" text-anchor="middle">eGFR 15~29</text>
    <line x1="15" y1="75" x2="115" y2="75" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="65" y="110" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">심한 감소</text>
    <text x="65" y="140" fill="#fff7ed" font-size="12" text-anchor="middle">신장내과 전문의</text>
    <text x="65" y="165" fill="#fff7ed" font-size="12" text-anchor="middle">투석·이식 준비</text>
    <text x="65" y="190" fill="#fff7ed" font-size="12" text-anchor="middle">1~2개월 검사</text>
  </g>

  <!-- 5단계 -->
  <g transform="translate(630, 130)">
    <rect width="130" height="240" rx="12" fill="url(#s5)" opacity="0.9"/>
    <text x="65" y="35" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">5단계</text>
    <text x="65" y="60" fill="#fef2f2" font-size="13" text-anchor="middle">eGFR &lt; 15</text>
    <line x1="15" y1="75" x2="115" y2="75" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="65" y="110" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">말기 신부전</text>
    <text x="65" y="140" fill="#fef2f2" font-size="12" text-anchor="middle">신대체요법 시행</text>
    <text x="65" y="165" fill="#fef2f2" font-size="12" text-anchor="middle">투석 또는 이식</text>
    <text x="65" y="190" fill="#fef2f2" font-size="12" text-anchor="middle">집중 치료 관리</text>
  </g>

  <text x="400" y="415" fill="#64748b" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif">※ 본 자료는 교육용 정보이며 개인별 진단은 담당 신장내과 전문의와 상의하십시오.</text>
</svg>
