<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">신장내과 진료 준비 체크리스트</title>
  <desc id="desc">검사표, 약 목록, 증상 기록, 질문을 한 장에 준비하는 네 단계 안내 그림</desc>
  <rect width="1200" height="630" fill="#f5f8f7"/>
  <text x="80" y="105" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#173b4d">진료 전 한 장에 모을 네 가지</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="165" width="235" height="330" rx="8" fill="#ffffff" stroke="#bdd3ce" stroke-width="3"/>
    <circle cx="198" cy="240" r="44" fill="#16746e"/>
    <path d="M173 240h50M198 215v50" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <text x="136" y="325" font-size="30" font-weight="700" fill="#173b4d">검사표</text>
    <text x="118" y="375" font-size="22" fill="#4b6671">날짜와 이전 결과</text>
    <text x="118" y="410" font-size="22" fill="#4b6671">함께 비교하기</text>
    <rect x="345" y="165" width="235" height="330" rx="8" fill="#ffffff" stroke="#e1c9bb" stroke-width="3"/>
    <rect x="427" y="205" width="72" height="72" rx="36" fill="#d96b4b"/>
    <path d="M442 241h42" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>
    <text x="399" y="325" font-size="30" font-weight="700" fill="#173b4d">약 목록</text>
    <text x="381" y="375" font-size="22" fill="#4b6671">처방약부터</text>
    <text x="381" y="410" font-size="22" fill="#4b6671">영양제까지</text>
    <rect x="610" y="165" width="235" height="330" rx="8" fill="#ffffff" stroke="#c7d3e2" stroke-width="3"/>
    <path d="M683 275c0-50 90-50 90 0v15h-90z" fill="#2d6174"/>
    <circle cx="728" cy="220" r="34" fill="#2d6174"/>
    <text x="665" y="325" font-size="30" font-weight="700" fill="#173b4d">변화 기록</text>
    <text x="647" y="375" font-size="22" fill="#4b6671">증상과 시작 시점</text>
    <text x="647" y="410" font-size="22" fill="#4b6671">짧게 적기</text>
    <rect x="875" y="165" width="235" height="330" rx="8" fill="#ffffff" stroke="#d7d0b4" stroke-width="3"/>
    <circle cx="992" cy="240" r="44" fill="#d4a938"/>
    <text x="978" y="257" font-size="50" font-weight="700" fill="#ffffff">?</text>
    <text x="944" y="325" font-size="30" font-weight="700" fill="#173b4d">질문</text>
    <text x="914" y="375" font-size="22" fill="#4b6671">중요한 순서대로</text>
    <text x="914" y="410" font-size="22" fill="#4b6671">세 묶음으로</text>
  </g>
  <path d="M120 550h960" stroke="#ccd8d4" stroke-width="3"/>
  <text x="80" y="590" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2f6049">목표: 스스로 진단하기가 아니라 내 변화를 정확히 전달하기</text>
</svg>
